# ============================================================================
# File: docker-compose.yml
# Vai trò: Cấu hình Docker Compose để triển khai và khởi chạy tức thì:
#   - mysql:   MySQL 8.0 (InnoDB)
#   - seeder:  Khởi tạo schema, indexes và dữ liệu mẫu trước khi API chạy
#   - api:     Backend REST API (Node.js 20 + Express 4 + tsx) tại cổng 4000
#   - web:     Frontend SPA (React 18 + Vite) tại cổng 5173
# ============================================================================

services:
  # 1. Dịch vụ Cơ sở dữ liệu MySQL 8.0
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-luxury_furniture}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -uroot -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - auren_net

  # 2. Dịch vụ Seeder (Tự động chạy seed.ts ngay khi MySQL healthy)
  seeder:
    image: node:20-alpine
    working_dir: /app/backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${DB_PASS:-rootpassword}
      DB_NAME: ${DB_NAME:-luxury_furniture}
      JWT_SECRET: ${JWT_SECRET:-auren-local-demo-only}
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
      - backend_node_modules:/app/backend/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run db:setup"
    networks:
      - auren_net

  # 3. Dịch vụ Backend REST API (Express + TypeScript)
  api:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app/backend
    depends_on:
      mysql:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${DB_PASS:-rootpassword}
      DB_NAME: ${DB_NAME:-luxury_furniture}
      JWT_SECRET: ${JWT_SECRET:-auren-local-demo-only}
      JWT_EXPIRES_IN: 2h
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
      - backend_node_modules:/app/backend/node_modules
    command: npm run dev
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:4000/health").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - auren_net

  # 4. Dịch vụ Frontend SPA (React 18 + Vite)
  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app/frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_TARGET: http://api:4000
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    command: >
      sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:5173/api").then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 18
    networks:
      - auren_net

volumes:
  mysql_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  auren_net:
    driver: bridge

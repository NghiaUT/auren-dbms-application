name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: auren-ci-db-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=auren-ci-db-only mysql -h 127.0.0.1 -uroot -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: auren-ci-db-only
      DB_NAME: auren_ci_test
      JWT_SECRET: auren-ci-jwt-only
      SQL_LOG: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm --prefix backend run db:setup
      - run: npm --prefix backend run typecheck
      - run: npm --prefix backend run build
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - run: npm --prefix backend run test:smoke
